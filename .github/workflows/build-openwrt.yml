name: Build OSTAR MT7688AN Firmware

on:
  workflow_dispatch:
  push:
    branches: [ostar-19.07]

jobs:
  build:
    runs-on: ubuntu-22.04  # 或 ubuntu-latest，但 22.04 更稳

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ostar-19.07

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential asciidoc binutils bzip2 flex gawk gcc-multilib gettext git git-core libncurses5-dev libncurses-dev libssl-dev make patch perl python3 python3-setuptools python3-distutils rsync subversion swig time unzip wget zlib1g-dev libz-dev libc6-dev file curl ccache

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cp config.mt76x8 .config   # 或 config.mt76x8-i2c-oled 等，根据需要
          make defconfig

      - name: Download dependencies
        run: make download -j$(nproc) || true

      - name: Build firmware
        run: make -j$(nproc) V=s   # V=s 显示详细日志

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ostar-firmware-mt76x8
          path: bin/targets/ramips/mt76x8/*.bin
