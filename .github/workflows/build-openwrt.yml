name: Build OSTAR MMDVM Firmware

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      config_variant:
        description: '选择配置文件（硬件变体）'
        required: true
        default: 'config.mt76x8'
        type: choice
        options:
          - config.mt76x8
          - config.mt76x8-i2c-oled
          - config.mt76x8-i2c-oled-noipv6
          - config.x86_64
      ssh:
        description: '启用 SSH 调试（输入 true）'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/BG4TGO-Tom/ostar.git
  REPO_BRANCH: ostar-19.07
  CONFIG_FILE: ${{ github.event.inputs.config_variant || 'config.mt76x8' }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 初始化环境 + 安装依赖（Ubuntu 24.04 最终修复）
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository universe -y
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential gettext subversion xsltproc gawk git unzip \
            zlib1g-dev libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync patch binutils bzip2 make findutils grep diffutils perl \
            libz-dev libc6-dev file git-core
          sudo apt-get autoremove --purge -qq
          sudo apt-get clean -qq
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆 ostar 源码
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 配置 feeds 并更新
        run: |
          cd openwrt
          cp feeds.conf.default feeds.conf || echo "No feeds.conf.default"
          ./scripts/feeds update -a

      - name: 安装 feeds 包（README 匹配）
        run: |
          cd openwrt
          ./scripts/feeds install luci-base luci-lib-base luci-compat luci-mod-status luci-mod-system luci-proto-ipv6 stm32flash || true
          ./scripts/feeds install -a -pmmdvm || true
          if [[ "${{ env.CONFIG_FILE }}" == config.mt76x8* ]]; then
            ./scripts/feeds install travelmate luci-app-travelmate luci-i18n-travelmate-zh-cn || true
          fi
          if [[ "${{ env.CONFIG_FILE }}" == config.x86_64 ]]; then
            ./scripts/feeds install luci-mod-admin-full || true
          fi

      - name: 执行 diy-part1.sh（可选）
        run: |
          cd openwrt
          if [ -f "$GITHUB_WORKSPACE/diy-part1.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/diy-part1.sh"
            "$GITHUB_WORKSPACE/diy-part1.sh"
          else
            echo "No diy-part1.sh"
          fi

      - name: 加载配置
        run: |
          cd openwrt
          if [ -f "$GITHUB_WORKSPACE/${{ env.CONFIG_FILE }}" ]; then
            cp "$GITHUB_WORKSPACE/${{ env.CONFIG_FILE }}" .config
          elif [ -f "${{ env.CONFIG_FILE }}" ]; then
            cp "${{ env.CONFIG_FILE }}" .config
          else
            echo "错误: ${{ env.CONFIG_FILE }} 未找到"
            exit 1
          fi
          make defconfig

      - name: SSH 调试
        uses: P3TERX/ssh2actions@v1.0.0
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: 下载包
        run: |
          cd openwrt
          make download -j8 || true
          find dl -size -1024c -delete || true

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo "编译线程: 最多 4 (19.07 防 OOM)"
          make -j4 V=s || make -j2 V=s || make -j1 V=s
          if [ $? -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || echo "unknown" > DEVICE_NAME
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 上传 bin 目录
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OSTAR_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: 整理固件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/* || exit 1
          rm -rf packages || true
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: 上传固件 artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OSTAR_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: 清理旧 runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 7
          keep_minimum_runs: 5
